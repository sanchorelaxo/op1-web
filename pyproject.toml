[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "op1-studio"
version = "0.1.0"
description = "Three.js OP-1 front panel with a local proxy that installs patches, packs and tapes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pymupdf>=1.24"]

[project.scripts]
op1-studio = "op1_studio.server:serve"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
op1_studio = ["client/*", "client/src/*", "client/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
